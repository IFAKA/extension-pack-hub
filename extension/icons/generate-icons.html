<!DOCTYPE html>
<html>
<head>
  <title>Generate Icons</title>
</head>
<body>
  <h1>Extension Pack Hub Icons</h1>
  <p>Right-click each canvas and save as PNG with the corresponding filename.</p>
  
  <div style="display: flex; gap: 20px; margin-top: 20px;">
    <div>
      <canvas id="icon16" width="16" height="16"></canvas>
      <p>icon16.png</p>
    </div>
    <div>
      <canvas id="icon48" width="48" height="48"></canvas>
      <p>icon48.png</p>
    </div>
    <div>
      <canvas id="icon128" width="128" height="128"></canvas>
      <p>icon128.png</p>
    </div>
  </div>

  <script>
    function drawIcon(canvasId, size) {
      const canvas = document.getElementById(canvasId);
      const ctx = canvas.getContext('2d');
      
      // Background
      ctx.fillStyle = '#1a73e8';
      ctx.beginPath();
      ctx.roundRect(0, 0, size, size, size * 0.125);
      ctx.fill();
      
      // Box icon
      const margin = size * 0.2;
      const boxSize = size - margin * 2;
      ctx.strokeStyle = 'white';
      ctx.lineWidth = size * 0.06;
      ctx.strokeRect(margin, margin + boxSize * 0.15, boxSize, boxSize * 0.7);
      
      // Box flaps
      ctx.beginPath();
      ctx.moveTo(margin, margin + boxSize * 0.15);
      ctx.lineTo(size / 2, margin);
      ctx.lineTo(size - margin, margin + boxSize * 0.15);
      ctx.stroke();
    }
    
    drawIcon('icon16', 16);
    drawIcon('icon48', 48);
    drawIcon('icon128', 128);
  </script>
</body>
</html>
