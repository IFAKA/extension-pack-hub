<svg width="1280" height="640" viewBox="0 0 1280 640" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a73e8"/>
      <stop offset="100%" style="stop-color:#0d47a1"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#f5f5f5"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="100" cy="100" r="200" fill="white" fill-opacity="0.05"/>
  <circle cx="1180" cy="540" r="300" fill="white" fill-opacity="0.05"/>
  <circle cx="640" cy="320" r="400" fill="white" fill-opacity="0.03"/>

  <!-- Main card -->
  <rect x="140" y="120" width="1000" height="400" rx="24" fill="url(#card)" filter="drop-shadow(0 20px 40px rgba(0,0,0,0.3))"/>

  <!-- Icon boxes in card -->
  <rect x="180" y="180" width="80" height="80" rx="12" fill="#1a73e8"/>
  <rect x="280" y="180" width="80" height="80" rx="12" fill="#34a853"/>
  <rect x="380" y="180" width="80" height="80" rx="12" fill="#ea4335"/>
  <rect x="480" y="180" width="80" height="80" rx="12" fill="#fbbc04"/>

  <!-- Checkmarks in boxes -->
  <path d="M210 220 L225 235 L250 200" stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M310 220 L325 235 L350 200" stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M410 220 L425 235 L450 200" stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M510 220 L525 235 L550 200" stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Arrow -->
  <path d="M600 220 L680 220 M660 200 L680 220 L660 240" stroke="#1a73e8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Pack box -->
  <rect x="720" y="160" width="120" height="120" rx="16" fill="#1a73e8"/>
  <rect x="740" y="190" width="80" height="60" rx="4" fill="none" stroke="white" stroke-width="4"/>
  <path d="M740 205 L780 180 L820 205" stroke="white" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- Share icon -->
  <circle cx="920" cy="220" r="50" fill="#e8f0fe"/>
  <circle cx="900" cy="200" r="12" fill="#1a73e8"/>
  <circle cx="940" cy="200" r="12" fill="#1a73e8"/>
  <circle cx="920" cy="240" r="12" fill="#1a73e8"/>
  <line x1="908" y1="206" x2="932" y2="234" stroke="#1a73e8" stroke-width="4"/>
  <line x1="932" y1="206" x2="926" y2="234" stroke="#1a73e8" stroke-width="4"/>

  <!-- URL bar -->
  <rect x="180" y="300" width="760" height="50" rx="8" fill="#f0f0f0"/>
  <text x="200" y="332" font-family="monospace" font-size="18" fill="#666">https://extension-pack-hub.github.io/#eyJuYW1lIjoiUHJpdmF...</text>

  <!-- Copy button -->
  <rect x="960" y="300" width="100" height="50" rx="8" fill="#1a73e8"/>
  <text x="985" y="332" font-family="Arial, sans-serif" font-size="16" fill="white" font-weight="bold">Copy</text>

  <!-- Stats -->
  <text x="180" y="420" font-family="Arial, sans-serif" font-size="24" fill="#333">
    <tspan fill="#1a73e8" font-weight="bold">4</tspan> extensions
    <tspan dx="40" fill="#34a853" font-weight="bold">✓</tspan> verified
    <tspan dx="40" fill="#666">Created Jan 2025</tspan>
  </text>

  <!-- Title -->
  <text x="640" y="580" font-family="Arial, sans-serif" font-size="56" fill="white" text-anchor="middle" font-weight="bold">Extension Pack Hub</text>
  <text x="640" y="620" font-family="Arial, sans-serif" font-size="24" fill="white" fill-opacity="0.8" text-anchor="middle">Modpacks for your browser</text>
</svg>
